---
name: download_and_execute.execve.detection
type: detection
meta:
  tags: ["download_and_execute", "type_detection", "event_execve", "T1105", "T1059.004"]
  attack: [ T1105 ]
  authors: ["nukunai"]
match-on:
  events:
    kunai: [execve, execve_script]
matches:
  $dl: .data.command_line ~= "(?:curl|wget) .*(?:\|| \-o| \-O).*(?:sh|bash|python3?|perl)"
condition: $dl
severity: 9
