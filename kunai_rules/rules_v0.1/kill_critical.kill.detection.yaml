---
name: kill_critical.kill.detection
type: detection
meta:
  tags: ["kill_critical", "type_detection", "event_kill", "T1489"]
  attack: [ T1489 ]
  authors: ["nukunai"]
match-on:
  events:
    kunai: [kill]
matches:
  $target: .data.target.name ~= "(docker|containerd|sshd|systemd|wazuh|crowdsec|splunk|check_mk|auditd|cron|agent)"
  $hard:   .data.signal == "SIGKILL"
condition: $target or $hard
severity: 8
